name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            dependencies: x64
          - platform: ARM64
            dependencies: arm64
    env:
      Configuration: Release
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Create test signing certificate
        id: cert
        shell: pwsh
        run: |
          $password = [guid]::NewGuid().ToString()
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=217334B3-10EF-48F6-BB35-BA93F82D16F3" `
            -KeyUsage DigitalSignature -FriendlyName "Locket CI test certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pfx = Join-Path $env:RUNNER_TEMP "Locket.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Export-Certificate -Cert $cert -FilePath artifacts\Locket.cer | Out-Null
          "pfx=$pfx" >> $env:GITHUB_OUTPUT
          "password=$password" >> $env:GITHUB_OUTPUT
          Write-Output "::add-mask::$password"

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3, not ${{ github.ref_name }}" }
          $manifest = 'src\Kleio\Package.appxmanifest'
          (Get-Content $manifest -Raw) -replace '(<Identity[^>]*?Version=")[^"]+"', "`${1}$version.0`"" | Set-Content $manifest -NoNewline
          Select-String -Path $manifest -Pattern 'Version="' | Select-Object -First 1

      - name: Restore
        run: msbuild Kleio.sln /t:Restore /p:Configuration=${{ env.Configuration }} /p:Platform=${{ matrix.platform }} /v:minimal

      - name: Build and package
        run: >-
          msbuild Kleio.sln /m /v:minimal "/clp:ErrorsOnly;Summary" /bl:artifacts\build.binlog
          /p:Configuration=${{ env.Configuration }}
          /p:Platform=${{ matrix.platform }}
          /p:AppxBundle=Never
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageDir=${{ github.workspace }}\artifacts\AppPackages\
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificateKeyFile=${{ steps.cert.outputs.pfx }}
          /p:PackageCertificatePassword=${{ steps.cert.outputs.password }}

      - name: List packages
        if: always()
        shell: pwsh
        run: |
          if (Test-Path artifacts\AppPackages) {
            Get-ChildItem artifacts\AppPackages -Recurse -File |
              ForEach-Object { "{0,10:N0} KB  {1}" -f ($_.Length / 1KB), $_.FullName.Substring((Get-Location).Path.Length + 1) }
          }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Locket-${{ matrix.platform }}
          path: |
            artifacts/AppPackages/**/Locket_*.msix
            artifacts/AppPackages/**/Dependencies/${{ matrix.dependencies }}/*.msix
            artifacts/AppPackages/**/Dependencies/${{ matrix.dependencies }}/*.appx
            artifacts/Locket.cer
          if-no-files-found: error

      - name: Release files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          $stage = Join-Path $env:RUNNER_TEMP 'Locket'
          New-Item -ItemType Directory -Force -Path $stage, artifacts\release | Out-Null
          $msix = Get-ChildItem artifacts\AppPackages -Recurse -Filter 'Locket_*.msix' | Select-Object -First 1
          Copy-Item $msix.FullName $stage
          Copy-Item $msix.FullName "artifacts\release\Locket-$version-${{ matrix.platform }}.msix"
          $deps = Join-Path $msix.DirectoryName 'Dependencies\${{ matrix.dependencies }}'
          if (Test-Path $deps) { Copy-Item $deps (Join-Path $stage 'Dependencies') -Recurse }
          Copy-Item artifacts\Locket.cer, tools\install\Install.ps1, tools\install\Install.cmd $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "artifacts\release\Locket-$version-${{ matrix.platform }}.zip"
          Get-ChildItem artifacts\release

      - name: Upload release files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: artifacts/release/*
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Locket-${{ matrix.platform }}-binlog
          path: artifacts/build.binlog

  test:
    name: Core tests (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check translations
        run: python tools/check_translations.py

      - uses: microsoft/setup-msbuild@v2

      - name: Build Kleio.Core.Tests
        run: >-
          msbuild tests\Kleio.Core.Tests\Kleio.Core.Tests.vcxproj /m /v:minimal "/clp:ErrorsOnly;Summary"
          /p:Configuration=Release
          /p:Platform=x64

      - name: Run Kleio.Core.Tests
        shell: pwsh
        run: |
          & "tests\Kleio.Core.Tests\bin\x64\Release\Kleio.Core.Tests.exe"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Kleio.Core.Tests failed ($LASTEXITCODE failed checks)"
            exit 1
          }

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          **Install:** download the zip for your PC (x64 for most PCs, ARM64 for Snapdragon), extract it and
          double-click `Install.cmd`. Windows asks for permission to trust Locket's signing certificate,
          then Locket installs and starts in the notification area. Running a newer release's `Install.cmd`
          updates it.

          Locket is also on the Microsoft Store, which needs no certificate step and updates automatically.
          NOTES
          gh release create "$GITHUB_REF_NAME" Locket-*.zip Locket-*.msix --repo "$GITHUB_REPOSITORY" --title "Locket ${GITHUB_REF_NAME#v}" --notes-file notes.md
